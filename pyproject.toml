[build-system]
requires = ["hatchling>=1.25"]
build-backend = "hatchling.build"

[project]
name = "hyze-cloud"
version = "0.1.1"
description = "Official Python SDK for the Hyze Cloud API"
readme = "README.md"
requires-python = ">=3.10"
authors = [{ name = "Hyze Cloud" }]
# PEP 639: a expressão SPDX é o que o PyPI mostra como licença. Sem ela o pacote aparece
# sem licença nenhuma na página, mesmo com o arquivo LICENSE no sdist.
license = "MIT"
license-files = ["LICENSE"]
keywords = ["hyze", "hyzecloud", "sdk", "api", "paas", "deploy", "python"]
classifiers = [
  "Development Status :: 4 - Beta",
  "Intended Audience :: Developers",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.10",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "Topic :: Software Development :: Libraries :: Python Modules",
  "Typing :: Typed",
]
dependencies = ["httpx>=0.27,<1"]

[project.optional-dependencies]
dev = [
  "mypy>=1.11",
  "pytest>=8.0",
  "pytest-asyncio>=0.24",
  "ruff>=0.6",
]

[project.urls]
Homepage = "https://hyzecloud.com"
Documentation = "https://docs.hyzecloud.app"
Repository = "https://github.com/Hyze-Cloud/hyzecloud-sdk-python"
Issues = "https://github.com/Hyze-Cloud/hyzecloud-sdk-python/issues"
Changelog = "https://github.com/Hyze-Cloud/hyzecloud-sdk-python/releases"

[tool.hatch.build.targets.wheel]
packages = ["src/hyzecloud"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"

[tool.ruff]
line-length = 100
target-version = "py310"
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM", "C4", "RUF"]

[tool.mypy]
python_version = "3.10"
strict = true
packages = ["hyzecloud"]
mypy_path = "src"
